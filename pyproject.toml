[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-agri-intelligence"
version = "0.1.0"
description = "NASA satellite data pipeline for global agricultural land suitability assessment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "rasterio>=1.3",
  "xarray>=2024.7",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "requests>=2.32",
  "scikit-learn>=1.4",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "Pillow>=10.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx2>=2.0",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
